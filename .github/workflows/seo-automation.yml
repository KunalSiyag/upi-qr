name: Automated SEO checks and IndexNow

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Run daily at 00:00 UTC (05:30 IST)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci

      - name: Build site (Triggers Postbuild IndexNow Ping)
        run: npm run build

      - name: Run SEO checks and IndexNow submission
        env:
          SITE_URL: https://www.proupiqr.in
        run: npm run seo:all

      - name: Generate Workflow Summary
        run: |
          echo "### SEO checks complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Site**: https://www.proupiqr.in" >> $GITHUB_STEP_SUMMARY
          echo "- **IndexNow + sitemap + RSS ping**: submitted" >> $GITHUB_STEP_SUMMARY
