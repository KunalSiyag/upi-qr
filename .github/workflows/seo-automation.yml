name: Automated SEO & Crawler Warmup

on:
  push:
    branches:
      - main
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  seo-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Execute Automated SEO Suite (IndexNow, RSS Pings, Crawler Warmup)
        env:
          SITE_URL: https://www.proupiqr.in
        run: npm run seo:all
